# Runs pin suggestions on this repository's own pull requests. Consumers use the same
# shape with `uses: ecobee/github-actions/pin_suggestions@v1` and no checkout step.
name: Pin suggestions (self)

on:
  pull_request:
    paths:
      - .github/workflows/**
      - "**/action.yml"
      - "**/action.yaml"
      - pin_suggestions/**

permissions:
  contents: read
  pull-requests: write

jobs:
  suggest-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A local action resolves from the workspace, so it must be checked out first.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./pin_suggestions
