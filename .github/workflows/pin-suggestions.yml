# Posts a pin suggestion on each mutable action reference a pull request adds.
# Advisory only: it never commits, and callers must not make it a required check.
# The author accepts suggestions with "Commit suggestions" in the GitHub UI.
#
# Callers must grant `contents: read` and `pull-requests: write`. See README.
name: Pin suggestions

on:
  workflow_call: {}

permissions: {}

jobs:
  suggest-pins:
    # Fork pull requests get a read-only token and can't be reviewed, so skip them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      PINACT_VERIFY: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Write pinning policy
        run: |
          cat > "$RUNNER_TEMP/pinact.yaml" <<'POLICY'
          # BEGIN pinning-policy
          version: 3
          rules:
            # Internal actions are exempt; they ship fixes through their version tags.
            - ignore: true
              conditions:
                - expr: lower(ActionRepoOwner) == "ecobee"
          # END pinning-policy
          POLICY

      # pinact-action installs pinact and reviewdog through aqua with checksums required.
      # skip_push keeps it off the commit path; review posts each pinact finding as a
      # comment: a suggested change, or an error such as an unresolvable reference.
      - name: Suggest pins
        id: suggest
        continue-on-error: true
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          config: ${{ runner.temp }}/pinact.yaml
          skip_push: "true"
          review: "true"
          verify: ${{ env.PINACT_VERIFY }}
          reviewdog_filter_mode: added
          reviewdog_fail_level: none

      - name: Report when suggestions could not be posted
        if: steps.suggest.outcome == 'failure'
        run: |
          echo "::warning title=Pin suggestions unavailable::Pin suggestions could not be posted. See the 'Suggest pins' step log for the reason. This does not block the pull request."
          echo "Pin suggestions could not be posted for this run. See the Suggest pins step log for the reason." >> "$GITHUB_STEP_SUMMARY"
