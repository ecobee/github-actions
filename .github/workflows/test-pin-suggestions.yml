name: Test pin suggestions

on:
  pull_request:
    paths:
      - .github/workflows/pin-suggestions.yml
      - .github/workflows/test-pin-suggestions.yml
      - tests/pin_suggestions/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  policy-specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The version and checksum are read from the reusable workflow, their single source.
      - name: Install pinact
        run: |
          workflow=.github/workflows/pin-suggestions.yml
          PINACT_VERSION="$(sed -n 's/^[[:space:]]*PINACT_VERSION:[[:space:]]*//p' "$workflow" | head -n 1)"
          PINACT_SHA256="$(sed -n 's/^[[:space:]]*PINACT_SHA256:[[:space:]]*//p' "$workflow" | head -n 1)"
          archive="$RUNNER_TEMP/pinact.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" pinact
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint spec
        run: shellcheck tests/pin_suggestions/test.sh

      - name: Run policy specs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/pin_suggestions/test.sh
